name: Tests

on:
  push:
    branches:
      - modern
  pull_request:
    branches:
      - modern
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ghidra
        uses: er28-0652/setup-ghidra@master
        with:
          version: "12.1.3"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gdb
          if [ -z "${GHIDRA_INSTALL_DIR:-}" ]; then
            echo "GHIDRA_INSTALL_DIR=/opt/ghidra" >> "$GITHUB_ENV"
          fi

      - name: Build vendored libdwarf/libdwarfp
        run: ./tools/build_libdwarf.sh

      - name: Install PyGhidra
        run: |
          python3 -m pip install --no-index \
            -f "$GHIDRA_INSTALL_DIR/Ghidra/Features/PyGhidra/pypkg/dist" \
            pyghidra
          python3 -m pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          PYGHIDRA_PYTHON="$(command -v python3)" ./run_tests.sh
