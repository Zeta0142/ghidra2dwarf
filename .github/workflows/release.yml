name: Release

on:
  push:
    branches:
      - modern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zip

      - name: Build libdwarf/libdwarfp from submodule
        run: ./tools/build_libdwarf.sh

      - name: Package script-directory release
        run: ./tools/package_release.sh linux-x86-64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra2dwarf-linux-x86-64
          path: build/ghidra2dwarf.zip

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/ghidra2dwarf.zip
          generate_release_notes: false
